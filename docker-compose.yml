services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8080}:8080"
  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    depends_on:
      - backend
