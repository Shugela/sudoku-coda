<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Target Game</title>
    <style>
        :root {
            --cell-size: 55px;
            --thick: 3px solid #000;
            --thin: 1px solid #ccc;
            --primary-blue: #0d6efd;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; padding: 20px; }
        
        /* Screens */
        .screen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .active { display: flex; }

        /* Welcome Screen Styling */
        .welcome-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        
        /* Game Styling */
        .stats { margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(9, var(--cell-size)); grid-template-rows: repeat(9, var(--cell-size)); border: var(--thick); background-color: #fff; }
        .cell { width: var(--cell-size); height: var(--cell-size); border: var(--thin); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        
        /* 3x3 Block Borders */
        .cell:nth-child(3n) { border-right: var(--thick); }
        .cell:nth-child(9n) { border-right: var(--thin); }
        .grid > div:nth-child(n+19):nth-child(-n+27), .grid > div:nth-child(n+46):nth-child(-n+54) { border-bottom: var(--thick); }

        /* States */
        .cell.target { background-color: #ffd700; font-weight: bold; }
        .cell.fixed { background-color: #f8f9fa; cursor: default; color: #333; }
        .cell.selected { background-color: #cfe2ff !important; outline: 2px solid var(--primary-blue); z-index: 5; }
        .cell.wrong { color: #dc3545; animation: shake 0.2s; }

        .controls { margin-top: 20px; display: flex; gap: 10px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 10px 20px; cursor: pointer; background: var(--primary-blue); color: white; border: none; border-radius: 4px; font-weight: bold; }
        
        /* Leaderboard Modal */
        #summary-screen {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border: 2px solid #000; z-index: 100; text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.3); border-radius: 8px; width: 90%; max-width: 450px;
        }
        table { width: 100%; margin: 15px 0; border-collapse: collapse; }
        th, td { border: 1px solid #dee2e6; padding: 8px; text-align: center; }
        .highlight { background-color: #fff3cd !important; font-weight: bold; }

        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    </style>
</head>
<body>

    <div id="screen-start" class="screen active">
        <div class="welcome-card">
            <h1>Sudoku Target Game</h1>
            <p>Enter your name to begin the challenge</p>
            <input type="text" id="player-name-input" placeholder="Your Name" style="width: 200px;">
            <br><br>
            <button onclick="startGame()">Start Game</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <h1>Sudoku Target Game</h1>
        <div class="stats">
            Level: <span id="level-val">1</span> | 
            Mistakes: <span id="mistakes-val">0</span>/3
        </div>

        <div class="grid" id="sudoku-grid"></div>

        <div id="message" style="margin-top:15px; font-weight:bold;">Click the golden cell and type 1-9</div>

        <div class="controls">
            <input type="number" id="guess-input" min="1" max="9" style="width: 60px; text-align: center;">
            <button onclick="submitMove()">Submit (Enter)</button>
        </div>
    </div>

    <div id="summary-screen">
        <h2 id="summary-title">Result</h2>
        <p id="summary-stats"></p>
        
        <h3>Leaderboard</h3>
        <table>
            <thead><tr><th>Rank</th><th>Name</th><th>Lvl</th><th>G</th><th>M</th></tr></thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        
        <button onclick="location.reload()" style="background:#6c757d">Play Again</button>
    </div>

    <script>
        let playerName = "";
        let currentLevel = 1;
        let selectedCell = null;
        let targetCoords = [0, 0];
        let totalGuesses = 0;
        let totalMistakes = 0;

        function startGame() {
            playerName = document.getElementById('player-name-input').value;
            if (!playerName) return alert("Please enter your name!");
            document.getElementById('screen-start').classList.remove('active');
            document.getElementById('screen-game').classList.add('active');
            initGame(1);
        }

        async function initGame(level) {
            const response = await fetch(`/start?level=${level}`);
            const data = await response.json();
            currentLevel = data.level;
            targetCoords = data.target;
            selectedCell = null;
            document.getElementById('level-val').innerText = currentLevel;
            renderGrid(data.grid);
        }

        function renderGrid(grid) {
            const gridEl = document.getElementById('sudoku-grid');
            gridEl.innerHTML = '';
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (grid[r][c] !== 0) {
                        cell.innerText = grid[r][c];
                        cell.classList.add('fixed');
                    } else {
                        cell.onclick = () => {
                            document.querySelectorAll('.cell').forEach(el => el.classList.remove('selected'));
                            cell.classList.add('selected');
                            selectedCell = { el: cell, r, c };
                            document.getElementById('guess-input').focus();
                        };
                        if (r === targetCoords[0] && c === targetCoords[1]) cell.classList.add('target');
                    }
                    gridEl.appendChild(cell);
                }
            }
        }

        async function submitMove() {
            const val = document.getElementById('guess-input').value;
            if (!selectedCell || !val) return;

            const response = await fetch('/move', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ row: selectedCell.r, col: selectedCell.c, value: parseInt(val) })
            });
            const result = await response.json();
            
            totalGuesses++;
            document.getElementById('mistakes-val').innerText = result.mistakes;

            if (result.correct) {
                selectedCell.el.innerText = val;
                selectedCell.el.classList.add('fixed');
                selectedCell.el.classList.remove('selected', 'target', 'wrong');
                if (result.success) {
                    if (currentLevel >= 16) endGame(true);
                    else setTimeout(() => initGame(currentLevel + 1), 1000);
                }
                selectedCell = null;
            } else {
                totalMistakes++;
                selectedCell.el.classList.add('wrong');
                if (result.failed) endGame(false);
            }
            document.getElementById('guess-input').value = '';
        }

        async function endGame(won) {
            document.getElementById('summary-screen').style.display = 'block';
            document.getElementById('summary-title').innerText = won ? "Victory!" : "Game Over";
            document.getElementById('summary-stats').innerText = `Total Guesses: ${totalGuesses} | Total Mistakes: ${totalMistakes}`;

            // Save score
            const res = await fetch('/save-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: playerName, level: currentLevel, guesses: totalGuesses, 
                    mistakes: totalMistakes, completed: won
                })
            });
            const boardData = await res.json();
            displayLeaderboard(boardData);
        }

        function displayLeaderboard(data) {
            const body = document.getElementById('leaderboard-body');
            body.innerHTML = '';
            
            // Render Top 5
            data.top5.forEach(s => {
                const isCurrent = (s.name === playerName && s.rank <= 5);
                body.innerHTML += `<tr class="${isCurrent ? 'highlight' : ''}">
                    <td>${s.rank}</td><td>${s.name}</td><td>${s.level}</td><td>${s.guesses}</td><td>${s.mistakes}</td>
                </tr>`;
            });

            // If player is outside Top 5
            if (data.player_row && data.player_row.rank > 5) {
                body.innerHTML += `<tr><td colspan="5">...</td></tr>`;
                const p = data.player_row;
                body.innerHTML += `<tr class="highlight">
                    <td>${p.rank}</td><td>${p.name}</td><td>${p.level}</td><td>${p.guesses}</td><td>${p.mistakes}</td>
                </tr>`;
            }
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitMove(); });
    </script>
</body>
</html>
